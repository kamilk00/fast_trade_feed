services:
  redis:
    image: redis:alpine
    container_name: fasttrade-redis
    restart: always

  web:
    build: .
    container_name: fasttrade-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    depends_on:
      - redis
    restart: always